<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoughts & AI Echoes - AI 私人微日記與部落格</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {

        .custom-scrollbar::-webkit-scrollbar {

</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

                        <div class="flex items-center gap-1.5">

    <!-- Confirm Modal -->

    <!-- JavaScript Application Logic -->
    <script>
        // State management
        let posts = JSON.parse(localStorage.getItem('reflect_ai_posts')) || [];
        let pendingAction = null;
        let filteredSearchText = '';
        let selectedTagFilter = null;

        // Default Personas Base
        const DEFAULT_PERSONAS = {
            optimist: { name: '樂觀陪伴者', icon: 'fa-sun', bg: 'bg-amber-500', desc: '給予肯定與正能量', guide: '請用極具正能量、溫暖陪伴、肯定優點與充滿智慧的語氣回覆。' },
            realist: { name: '理性分析師', icon: 'fa-chart-line', bg: 'bg-emerald-600', desc: '提供客觀建議與步驟', guide: '請用邏輯清晰、客觀中立、結構化且提供具體行動建議的語氣回覆。' },
            comedian: { name: '幽默解壓者', icon: 'fa-masks-theater', bg: 'bg-rose-500', desc: '用輕鬆笑點看待煩惱', guide: '請用輕鬆幽默、風趣解嘲、帶有適度玩笑但仍保持友善的語氣回覆。' }
        };

        // Custom Personas stored in localStorage
        let customPersonas = JSON.parse(localStorage.getItem('reflect_ai_custom_personas')) || {};

        function getMergedPersonas() {
            return { ...DEFAULT_PERSONAS, ...customPersonas };
        }

        // DOM Elements
        let postsContainer;
        let emptyState;
        let postCount;
        let publishModal;
        let confirmModal;
        let searchInput;
        let managePersonasModal;

        // Save Custom Personas
        function saveCustomPersonas() {
            localStorage.setItem('reflect_ai_custom_personas', JSON.stringify(customPersonas));
            renderPersonaSelectors();
            renderPersonasManageList();
        }

        // Save & Update Helper
        function savePosts() {
            localStorage.setItem('reflect_ai_posts', JSON.stringify(posts));
            updatePostCount();
            updateMoodSummary();
        }

        function updatePostCount() {
            if (postCount) {
                const count = getFilteredPosts().length;
                postCount.textContent = count;
            }
        }

        function updateTagFilterBar() {
            const filterContainer = document.getElementById('activeTagFilterContainer');
            const activeTagName = document.getElementById('activeTagName');
            if (!filterContainer || !activeTagName) return;

            if (selectedTagFilter) {
                activeTagName.textContent = selectedTagFilter;
                filterContainer.classList.remove('hidden');
                filterContainer.classList.add('flex');
            } else {
                filterContainer.classList.add('hidden');
                filterContainer.classList.remove('flex');
            }
        }

        function filterByTag(tagName) {
            selectedTagFilter = tagName;
            updateTagFilterBar();
            renderPosts();
        }

        function clearTagFilter() {
            selectedTagFilter = null;
            updateTagFilterBar();
            renderPosts();
        }

        function getFilteredPosts() {
            let result = posts;

            // Apply Tag Filter
            if (selectedTagFilter) {
                result = result.filter(p => p.tags && p.tags.includes(selectedTagFilter));
            }

            // Apply Text Search Filter
            if (filteredSearchText) {
                const query = filteredSearchText.toLowerCase();
                result = result.filter(p => 
                    (p.title && p.title.toLowerCase().includes(query)) ||
                    (p.content && p.content.toLowerCase().includes(query)) ||
                    (p.tags && p.tags.some(t => t.toLowerCase().includes(query)))
                );
            }

            return result;
        }

        // Render Posts
        function renderPosts() {
            updatePostCount();
            updateTagFilterBar();
            postsContainer.innerHTML = '';

            const displayPosts = getFilteredPosts();
            const allPersonas = getMergedPersonas();

            if (displayPosts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            displayPosts.forEach(post => {
                const postEl = document.createElement('article');
                postEl.className = 'bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm overflow-hidden transition hover:shadow-md';
                postEl.dataset.id = post.id;

                const formattedDate = new Date(post.createdAt).toLocaleString('zh-TW', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'

        // Publish / Edit Submit Handler
        async function handlePublishSubmit(e) {
            e.preventDefault();

            const editingId = document.getElementById('editingPostId').value;
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const selectedPersona = document.querySelector('input[name="aiPersona"]:checked')?.value || 'optimist';
            const initialCount = parseInt(document.getElementById('initialReplyCount')?.value || '1', 10);

            if (!content) return;

            // If in Edit Mode
            if (editingId) {
                const targetPost = posts.find(p => p.id === editingId);
                if (targetPost) {
                    // Save historical snapshot before updating
                    if (!targetPost.history) targetPost.history = [];
                    targetPost.history.unshift({
                        title: targetPost.title,
                        content: targetPost.content,
                        comments: [...(targetPost.comments || [])],
                        editedAt: new Date().toISOString()
                    });

                    // Clear current comments and update content
                    targetPost.title = title;
                    targetPost.content = content;
                    targetPost.comments = [];

                    savePosts();
                    renderPosts();
                    closePublishModal();

                    // Re-trigger AI reply for edited post
                    const postElement = postsContainer.querySelector(`[data-id="${targetPost.id}"]`);
                    if (postElement) {
                        await generateMultiAiReplies(targetPost.id, postElement, initialCount, selectedPersona, true);
                    }
                }
                return;
            }

            // Create New Post Mode
            const newPost = {
                id: 'post-' + Date.now(),
                title: title,
                content: content,
                tags: [],
                mood: '平靜 🌱',
                createdAt: new Date().toISOString(),
                comments: [],
                history: []
            };

            posts.unshift(newPost);
            savePosts();
            renderPosts();
            closePublishModal();

            // Auto trigger AI reply & auto-tagging for new posts
            const postElement = postsContainer.querySelector(`[data-id="${newPost.id}"]`);
            if (postElement) {
                await generateMultiAiReplies(newPost.id, postElement, initialCount, selectedPersona, true);
            }
        }

        function deletePost(postId) {
            posts = posts.filter(p => p.id !== postId);
            savePosts();
            renderPosts();
        }

        // Markdown Export Logic
        function formatPostToMd(post) {
            const dateStr = new Date(post.createdAt).toLocaleString('zh-TW');
            let md = `# ${post.title || '無題隨筆'}\n\n`;
            md += `- **發佈時間**: ${dateStr}\n`;
            md += `- **情緒評估**: ${post.mood || '未記錄'}\n`;
            if (post.tags && post.tags.length > 0) {
                md += `- **標籤**: ${post.tags.join(', ')}\n`;
            }
            md += `\n---\n\n### 📝 隨筆內容\n\n${post.content}\n\n`;

            if (post.comments && post.comments.length > 0) {
                md += `### 🤖 AI 回應與留言\n\n`;
                post.comments.forEach(c => {
                    const commentDate = new Date(c.createdAt).toLocaleString('zh-TW');
                    md += `#### 💬 ${c.author} (${commentDate})\n\n${c.content}\n\n`;
                });
            }

            if (post.history && post.history.length > 0) {
                md += `### 📜 歷史修訂版本\n\n`;
                post.history.forEach((h, idx) => {
                    const hDate = new Date(h.editedAt).toLocaleString('zh-TW');
                    md += `<details>\n<summary>版本 ${post.history.length - idx} (${hDate})</summary>\n\n`;
                    md += `**原文內容：**\n\n${h.content}\n\n`;
                    if (h.comments && h.comments.length > 0) {
                        md += `**當下的 AI 留言：**\n\n`;
                        h.comments.forEach(hc => {
                            md += `- **${hc.author}**: ${hc.content}\n`;
                        });
                    }
                    md += `\n</details>\n\n`;
                });
            }

            return md;
        }

        function downloadFile(filename, textContent) {
            const blob = new Blob([textContent], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function exportSinglePostToMd(post) {
            const filename = `${post.title || '隨筆'}_${new Date(post.createdAt).toISOString().slice(0, 10)}.md`;
            const content = formatPostToMd(post);
            downloadFile(filename, content);
        }

        function exportAllPostsToMd() {
            if (posts.length === 0) {
                alertModal('目前沒有任何記錄可供匯出。');
                return;
            }

            let fullMd = `# ReflectAI - 個人隨筆與 AI 迴響完整匯出紀錄\n\n`;
            fullMd += `> 匯出時間：${new Date().toLocaleString('zh-TW')}\n`;
            fullMd += `> 總篇數：${posts.length} 篇\n\n`;
            fullMd += `=`.repeat(40) + `\n\n`;

            posts.forEach((post, i) => {
                fullMd += formatPostToMd(post);
                if (i < posts.length - 1) {
                    fullMd += `\n\n` + `=`.repeat(40) + `\n\n`;
                }
            });

            const filename = `ReflectAI_Journal_Export_${new Date().toISOString().slice(0, 10)}.md`;
            downloadFile(filename, fullMd);
        }

        // Gemini AI Multi-Reply Generation
        async function generateMultiAiReplies(postId, postElement, count = 1, preferredPersonaKey = 'auto', autoAnalyze = false) {
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            const loadingIndicator = postElement.querySelector('.ai-loading-indicator');
            const replyBtn = postElement.querySelector('.request-ai-reply-btn');

            loadingIndicator.classList.remove('hidden');
            replyBtn.disabled = true;
            replyBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const allPersonas = getMergedPersonas();
            const allKeys = Object.keys(allPersonas);
            
            // Determine targeted personas
            let selectedKeys = [];
            if (preferredPersonaKey !== 'auto' && allPersonas[preferredPersonaKey]) {
                selectedKeys.push(preferredPersonaKey);
            }
            
            // Fill up remaining personas randomly without duplicate
            const remainingKeys = allKeys.filter(k => !selectedKeys.includes(k));
            for (let i = remainingKeys.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [remainingKeys[i], remainingKeys[j]] = [remainingKeys[j], remainingKeys[i]];
            }
            
            while (selectedKeys.length < count && remainingKeys.length > 0) {
                selectedKeys.push(remainingKeys.shift());
            }

            const targetPersonasPrompt = selectedKeys.map(k => {
                const p = allPersonas[k];
                return `- 角色代碼 "${k}" (${p.name}): ${p.guide}`;
            }).join('\n');

            const systemPrompt = `你是一個擁有多重 AI 人格的日記社群互動助手。請代表以下 ${selectedKeys.length} 位 AI 角色針對使用者的隨筆寫下個別的留言回應：

【登場角色列表】：
${targetPersonasPrompt}

要求：
1. 為這 ${selectedKeys.length} 位角色各自撰寫一篇符合其人設的短留言（每篇約 80-150 字）。
2. 各角色的觀點與語氣必須鮮明、互相對應且富有獨特性。
3. ${autoAnalyze ? '同時對這篇隨筆評估一個簡短情緒（格式如："平靜與沉思 🌱"）以及 1~3 個適當的主題標籤（如 ["#工作", "#靈感"]）。' : ''}`;

            const userPrompt = `【隨筆標題】：${post.title || '無'}\n【隨筆內容】：${post.content}`;

            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const schemaProperties = {
                    "replies": {
                        "type": "ARRAY",
                        "items": {
                            "type": "OBJECT",
                            "properties": {
                                "personaKey": { "type": "STRING", "description": "對應的角色代碼" },
                                "comment": { "type": "STRING", "description": "該角色的留言內容" }
                            },
                            "required": ["personaKey", "comment"]
                        }
                    }
                };

                if (autoAnalyze) {
                    schemaProperties["mood"] = { "type": "STRING", "description": "4-6字的情緒摘要加上一個Emoji" };
                    schemaProperties["tags"] = { "type": "ARRAY", "items": { "type": "STRING" }, "description": "1-3 個主題標籤" };
                }

                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: schemaProperties,
                            required: ["replies"]
                        }
                    }
                };

                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (rawText) {
                    const parsed = JSON.parse(rawText);
                    if (autoAnalyze) {
                        if (parsed.mood) post.mood = parsed.mood;
                        if (parsed.tags) post.tags = parsed.tags;
                    }

                    if (parsed.replies && Array.isArray(parsed.replies)) {
                        if (!post.comments) post.comments = [];
                        parsed.replies.forEach(r => {
                            const pObj = allPersonas[r.personaKey] || { name: 'AI 夥伴' };
                            post.comments.push({
                                id: 'comment-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                                personaKey: r.personaKey,
                                author: pObj.name,
                                content: r.comment,
                                createdAt: new Date().toISOString()
                            });
                        });
                        savePosts();
                        renderPosts();
                    }
                }

            } catch (error) {
                console.error('Error generating AI response:', error);
                alertModal('AI 留言生成失敗，請稍後再試。');
            } finally {
                loadingIndicator.classList.add('hidden');
                replyBtn.disabled = false;
                replyBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
            try {
                const res = await fetch(url, options);
                if (!res.ok && res.status === 429 && retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                return res;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw err;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#032;");
        }

        function alertModal(msg) {
            showConfirmModal('提示', msg, null);
            document.getElementById('cancelConfirmBtn').classList.add('hidden');
            document.getElementById('actionConfirmBtn').textContent = '知道了';
        }

        // Render Persona Radios in Publish Modal
        function renderPersonaSelectors() {
            const container = document.getElementById('personaSelector');
            if (!container) return;
            container.innerHTML = '';

            const allPersonas = getMergedPersonas();
            Object.keys(allPersonas).forEach((key, index) => {
                const p = allPersonas[key];
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition';
                label.innerHTML = `
                    <input type="radio" name="aiPersona" value="${key}" ${index === 0 ? 'checked' : ''} class="text-indigo-600 focus:ring-indigo-500">
                    <div class="w-6 h-6 rounded-lg ${p.bg} text-white flex items-center justify-center shrink-0 text-xs">
                        <i class="fa-solid ${p.icon}"></i>
                    </div>
                    <div class="min-w-0">
                        <div class="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate">${escapeHtml(p.name)}</div>
                        <div class="text-[10px] text-slate-400 truncate">${escapeHtml(p.desc || '')}</div>
                    </div>
                `;
                container.appendChild(label);
            });
        }

        // Render Personas in Management Modal
        function renderPersonasManageList() {
            const container = document.getElementById('personasManageList');
            if (!container) return;
            container.innerHTML = '';

            const allPersonas = getMergedPersonas();
            Object.keys(allPersonas).forEach(key => {
                const p = allPersonas[key];
                const isCustom = key.startsWith('custom_');
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs';
                div.innerHTML = `
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-8 h-8 rounded-lg ${p.bg} text-white flex items-center justify-center shrink-0">
                            <i class="fa-solid ${p.icon}"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                                <span>${escapeHtml(p.name)}</span>
                                ${isCustom ? '<span class="text-[9px] bg-purple-100 dark:bg-purple-950 text-purple-600 dark:text-purple-300 px-1.5 py-0.2 rounded font-normal">自訂</span>' : '<span class="text-[9px] bg-slate-100 dark:bg-slate-700 text-slate-500 px-1.5 py-0.2 rounded font-normal">預設</span>'}
                            </div>
                            <div class="text-[11px] text-slate-400 truncate">${escapeHtml(p.desc || p.guide)}</div>
                        </div>
                    </div>
                    ${isCustom ? `
                        <button onclick="deleteCustomPersona('${key}')" class="text-slate-400 hover:text-rose-500 p-1.5 rounded-lg transition" title="刪除角色">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    ` : ''}
                `;
                container.appendChild(div);
            });
        }

        function deleteCustomPersona(key) {
            delete customPersonas[key];
            saveCustomPersonas();
        }

        function updateMoodSummary() {
            const moodEl = document.getElementById('dominantMood');
            if (!moodEl) return;
            if (posts.length > 0 && posts[0].mood) {
                moodEl.textContent = posts[0].mood;
            } else {
                moodEl.textContent = '積極平穩 🌿';
            }
        }

        // Initialize App on window load
        window.addEventListener('DOMContentLoaded', () => {
            postsContainer = document.getElementById('postsContainer');
            emptyState = document.getElementById('emptyState');
            postCount = document.getElementById('postCount');
            publishModal = document.getElementById('publishModal');
            confirmModal = document.getElementById('confirmModal');
            searchInput = document.getElementById('searchInput');
            managePersonasModal = document.getElementById('managePersonasModal');

            // Theme Toggle Logic
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            themeToggleBtn?.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Forms setup
            document.getElementById('addPersonaForm')?.addEventListener('submit', handleAddPersonaSubmit);
            document.getElementById('closeManagePersonasModalBtn')?.addEventListener('click', closeManagePersonasModal);

            setupEventListeners();
            renderPersonaSelectors();
            renderPersonasManageList();
            renderPosts();
            updateMoodSummary();
        });
    </script>
</body>
</html>
